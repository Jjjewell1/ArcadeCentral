services:
  frontend:
    build: ./frontend
    networks: [default, coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.arcade.rule=Host(`arcade.jewellcore.com`)
      - traefik.http.routers.arcade.entrypoints=http
      - traefik.http.services.arcade.loadbalancer.server.port=80
    restart: unless-stopped
  server:
    build: ./server
    networks: [coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.arcade-api.rule=Host(`arcade.jewellcore.com`) && PathPrefix(`/api`)
      - traefik.http.routers.arcade-api.entrypoints=http
      - traefik.http.services.arcade-api.loadbalancer.server.port=3001
    environment:
      - NAS_MOUNT_PATH=/mnt/user/games
    env_file: .env
    restart: unless-stopped
    volumes:
      - /mnt/user/games:/mnt/user/games:ro
      # - ./games:/app/games:ro
networks:
  coolify:
    external: true
